name: Stage 2-I independent Nash dominance on lambda 0.61 conditional root

on:
  push:
    branches:
      - research/stage2i-active-set-nash-bellman-homotopy
    paths:
      - '.github/workflows/stage2i-global-061.yml'
      - 'research/02-kinetic-exchange-yakovenko/stage2i/src/global_dominance_audit.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  global-nash-at-061:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt 'cvxpy>=1.6,<1.8' 'clarabel>=0.9,<0.12'
      - name: Syntax checks and convex APIs
        run: |
          python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2i/src/
          python -c 'import cvxpy; assert "CLARABEL" in cvxpy.installed_solvers()'
      - name: Fetch baseline Stage 2-H value
        uses: actions/download-artifact@v4
        with:
          run-id: 41748837033
          github-token: ${{ github.token }}
          name: stage2h-5x5-active-payment-private-root
          path: research/02-kinetic-exchange-yakovenko/stage2h/results
      - name: Fetch solved lambda 0.61 joint conditional root
        uses: actions/download-artifact@v4
        with:
          run-id: 41770869977
          github-token: ${{ github.token }}
          name: stage2i-conditional-kkt-attempt
          path: research/02-kinetic-exchange-yakovenko/stage2i/results
      - name: Reoptimize globally all 49 Nash problems
        run: python research/02-kinetic-exchange-yakovenko/stage2i/src/global_dominance_audit.py
      - name: Verify no false full-source-rate equilibrium claim
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('research/02-kinetic-exchange-yakovenko/stage2i/results/global_dominance_061.json').read_text())
          assert d['pairs']==49
          assert d['full_source_rate_5x5_certified'] is False
          assert d['stationary_GE'] is False
          print(d)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2i-lambda061-global-nash
          path: research/02-kinetic-exchange-yakovenko/stage2i/results/global_dominance_061*
