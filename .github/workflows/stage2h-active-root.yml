name: Stage 2-H 5x5 private root after Nash payment active-set repair

on:
  pull_request:
    paths:
      - 'research/02-kinetic-exchange-yakovenko/stage2h/scripts/solve_5x5_active.py'
      - '.github/workflows/stage2h-active-root.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-private-root:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Python syntax and solver dependencies
        run: |
          python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2h/scripts/solve_5x5_active.py
          python -c 'import numpy,scipy,numba; print(numpy.__version__,scipy.__version__,numba.__version__)'
      - name: Root corrected 5x5 private Nash Bellman and follow matching rate
        run: python research/02-kinetic-exchange-yakovenko/stage2h/scripts/solve_5x5_active.py --maxfev 500
      - name: Report source-rate and acceptance gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/02-kinetic-exchange-yakovenko/stage2h/results/private_5x5_active_root.json').read_text())
          print('source-rate candidate:',d['source_rate_candidate'])
          print('reached multiplier:',d['reached_multiplier'])
          print('intermediate root passed:',d['repaired_lambda_055_converged'])
          assert d['stationary_GE'] is False
          assert d['all_pair_global_nash_certified'] is False
          PY
      - name: Upload corrected private root experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2h-5x5-active-payment-private-root
          path: research/02-kinetic-exchange-yakovenko/stage2h/results/
          retention-days: 30
