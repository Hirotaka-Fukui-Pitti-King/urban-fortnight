name: Stage 2-E continuous joint capital-money optimization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-economic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tested Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: |
          python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2c/src
          python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2e
      - name: Run prior canonical Molico-Zhang tests
        env:
          PYTHONPATH: research/02-kinetic-exchange-yakovenko/stage2c/src
        run: python -m unittest discover -s research/02-kinetic-exchange-yakovenko/stage2c/tests -v
      - name: Run six Stage 2-E economic tests
        run: python -m unittest discover -s research/02-kinetic-exchange-yakovenko/stage2e/tests -v
      - name: Execute conditional CM and continuous Nash computations
        run: python research/02-kinetic-exchange-yakovenko/stage2e/scripts/run_stage2e.py
      - name: Execute source-ordered CM price and next-DM fixed-point diagnostics
        run: python research/02-kinetic-exchange-yakovenko/stage2e/scripts/run_source_iteration_audit.py --steps 80
      - name: Reject false monetary GE on source iteration trace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/02-kinetic-exchange-yakovenko/stage2e/results/source_iteration_audit.json').read_text())
          assert x['full_stationary_general_equilibrium'] is False
          assert x['status']!='CANDIDATE_NOT_CERTIFIED'
          for r in x['history']:
              assert abs(r['fiat_post_CM']-1)<1e-8
              assert abs(r['fiat_post_DM']-1)<1e-8
              assert abs(r['CM_budget_gap'])<1e-8
              assert r['mass_error']<1e-8
          print('Source-ordered iteration audited without false GE claim.')
          PY
      - name: Independently enforce no false stationary monetary GE claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/02-kinetic-exchange-yakovenko/stage2e/results/conditional_report.json').read_text())
          assert x['status']=='ONLY_CONDITIONAL_CM_AUCTIONS_NO_STATIONARY_GE'
          assert not x['equilibrium_certified']
          assert not x['arbitrary_money_normalization']
          assert not x['original_100x100_replication'] if 'original_100x100_replication' in x else True
          assert len(x['grids'])==2
          for r in x['grids']:
              assert not r['stationary_GE']
              assert abs(r['CM_money_residual'])<1e-9
              assert abs(r['budget_residual'])<1e-9
              assert r['Bellman_sup']>1
              assert r['next_distribution_sup']>.01
          print('Conditional money auctions certified, stationary GE NOT established.')
          PY
      - name: Upload executed JSON CSV and SVG evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2e-continuous-CM-conditional-not-GE
          path: research/02-kinetic-exchange-yakovenko/stage2e/results/
          if-no-files-found: error
          retention-days: 30
