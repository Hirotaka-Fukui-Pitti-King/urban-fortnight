name: Stage 2-I global Nash verification of last 0.85 conditional branch
on:
  push:
    branches:
      - research/stage2i-active-set-nash-bellman-homotopy
    paths:
      - '.github/workflows/stage2i-global-last.yml'
      - 'research/02-kinetic-exchange-yakovenko/stage2i/src/audit_global_last_branch.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  global-last:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt 'cvxpy>=1.6,<1.8' 'clarabel>=0.9,<0.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 41748837033
          github-token: ${{ github.token }}
          name: stage2h-5x5-active-payment-private-root
          path: research/02-kinetic-exchange-yakovenko/stage2h/results
      - uses: actions/download-artifact@v4
        with:
          run-id: 41772112814
          github-token: ${{ github.token }}
          name: stage2i-conditional-kkt-attempt
          path: research/02-kinetic-exchange-yakovenko/stage2i/results
      - run: python research/02-kinetic-exchange-yakovenko/stage2i/src/audit_global_last_branch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2i-lastbranch-global-nash
          path: research/02-kinetic-exchange-yakovenko/stage2i/results/global_dominance_last_branch.json
