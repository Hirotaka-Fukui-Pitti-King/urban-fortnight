name: Stage 2-B joint portfolio and bargaining prototype

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/02-kinetic-exchange-yakovenko/stage2b/**'
      - '.github/workflows/stage2b.yml'

permissions:
  contents: read

jobs:
  fixed-price-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install scientific packages
        run: python -m pip install -r requirements.txt
      - name: Parse Stage 2-B Python files
        run: python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2b
      - name: Revalidate canonical Aiyagari baseline
        run: python -m unittest discover -s research/00-heterogeneous-agent-ge/tests -v
      - name: Run seven economic and kinetic diagnostics
        run: python -m unittest discover -s research/02-kinetic-exchange-yakovenko/stage2b/tests -v
      - name: Execute fixed-price joint DP and four particle replications
        run: python research/02-kinetic-exchange-yakovenko/stage2b/scripts/run_stage2b.py --pop 20000
      - name: Confirm clear non-equilibrium label and full accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('research/02-kinetic-exchange-yakovenko/stage2b/results/fixed_price_diagnostics.json')
          result=json.loads(path.read_text())
          assert 'NOT_GENERAL_EQUILIBRIUM' in result['status']
          assert result['computed']['value_residual'] < 1e-7
          assert abs(result['computed']['capital_price_consistency']) > 0.1
          assert abs(result['computed']['money_supply_excess']) > 0.01
          assert all(x['dm_money_conservation_error']==0 for x in result['particles'])
          print('Prototype is privately solved, but full equilibrium FAILED as documented.')
          PY
      - name: Upload Python test and simulation outputs
        uses: actions/upload-artifact@v4
        with:
          name: stage2b-fixed-price-non-equilibrium
          path: |
            research/02-kinetic-exchange-yakovenko/stage2b/results/*.json
            research/02-kinetic-exchange-yakovenko/stage2b/results/*.csv
          if-no-files-found: error
