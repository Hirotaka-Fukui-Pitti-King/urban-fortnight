name: Stage 2-H 5x5 convex Nash one-pair numerical audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-convex-five:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt 'cvxpy>=1.6,<1.8' 'clarabel>=0.9,<0.12'
      - name: Parse and verify convex solver
        run: |
          python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2h/scripts/probe_5x5_convex_pair.py
          python -c 'import cvxpy,clarabel; assert "CLARABEL" in cvxpy.installed_solvers()'
      - name: Globally bounded Nash problem on 5x5 interpolated value function
        run: python research/02-kinetic-exchange-yakovenko/stage2h/scripts/probe_5x5_convex_pair.py
      - name: Prevent a false 5x5 private equilibrium claim
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('research/02-kinetic-exchange-yakovenko/stage2h/results/5x5_convex_pair_probe.json').read_text())
          assert r['certified_5x5_private_root'] is False
          assert r['stationary_GE'] is False
          assert r['independent_bound_reached'] is True
          print('5x5 Nash-only objective bound:',r['independent_global_gap'])
          PY
      - name: Save numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2h-5x5-convex-pair-audit
          path: research/02-kinetic-exchange-yakovenko/stage2h/results/
          if-no-files-found: warn
