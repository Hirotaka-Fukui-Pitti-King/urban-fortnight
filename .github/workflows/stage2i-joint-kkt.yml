name: Stage 2-I simultaneous conditional KKT Bellman full-rate attempt

on:
  push:
    branches:
      - research/stage2i-active-set-nash-bellman-homotopy
    paths:
      - '.github/workflows/stage2i-joint-kkt.yml'
      - 'research/02-kinetic-exchange-yakovenko/stage2i/src/conditional_kkt.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  direct-conditional-root:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt 'cvxpy>=1.6,<1.8' 'clarabel>=0.9,<0.12'
      - name: Validate Python syntax, imported APIs and model classes
        run: |
          python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2i/src/
          python -c 'import numpy, scipy, numba, cvxpy; assert "CLARABEL" in cvxpy.installed_solvers()'
      - name: Fetch verified intermediate-root value and policies
        uses: actions/download-artifact@v4
        with:
          run-id: 41748837033
          github-token: ${{ github.token }}
          name: stage2h-5x5-active-payment-private-root
          path: research/02-kinetic-exchange-yakovenko/stage2h/results
      - name: Attempt direct conditional KKT Bellman roots at increasing matching rate
        run: python research/02-kinetic-exchange-yakovenko/stage2i/src/conditional_kkt.py --max-nfev 25
      - name: Verify results declare actual mathematical status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/02-kinetic-exchange-yakovenko/stage2i/results/joint_kkt_source_rate_attempt.json")
          if not p.is_file():
              raise SystemExit("No joint KKT result artifact: investigate failure logs")
          d=json.loads(p.read_text())
          print("SOURCE_RATE_REACHED",d["matching_last_accepted"])
          print("RESULT_STATUS",d["status"])
          assert d["stationary_GE"] is False
          assert d["full_source_rate_globally_certified"] is d["final_check"]["verified_source_rate_5x5_private_fixedpoint"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2i-conditional-kkt-attempt
          path: |
            research/02-kinetic-exchange-yakovenko/stage2i/results/joint_kkt_*
          retention-days: 30
