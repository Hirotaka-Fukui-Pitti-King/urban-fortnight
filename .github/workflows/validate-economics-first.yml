name: Validate Economics-First Lectures

on:
  pull_request:
    paths:
      - 'lectures/economics-first/**'
      - 'lectures/literature/**'
      - '.github/workflows/validate-economics-first.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lecture-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r lectures/economics-first/requirements.txt
      - name: Recompute pedagogical equilibria and SVG figures
        run: python lectures/economics-first/scripts/generate_figures.py --output lectures/economics-first/figures
      - name: Mathematical and artifact tests
        run: python -m unittest discover -s lectures/economics-first/tests -v
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render HTML versions
        shell: bash
        run: |
          set -euo pipefail
          for file in lectures/economics-first/*.qmd; do
            quarto render "$file" --to html
          done
      - name: Install Japanese font and render Typst
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          set -euo pipefail
          for file in lectures/economics-first/*.qmd; do
            quarto render "$file" --to typst
          done
