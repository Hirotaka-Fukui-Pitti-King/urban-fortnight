name: Stage 2-H diagnostic trust-region 5x5 private root

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-private:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Parse experimental 5x5 code
        run: python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2h/scripts/solve_5x5_trust_region.py
      - name: Execute safeguarded trust-region private root
        run: python research/02-kinetic-exchange-yakovenko/stage2h/scripts/solve_5x5_trust_region.py --max-nfev 140
      - name: Reject a false 5x5 global-Nash or GE claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/02-kinetic-exchange-yakovenko/stage2h/results/5x5_trust_region.json").read_text())
          assert d["stationary_GE"] is False
          assert d.get("Nash_global_optimality_verified") is False
          print("Results diagnostic only:",d.get("status"))
          PY
      - name: Upload executed trust-region and 5x5 seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2h-trust-region-private-5x5
          path: research/02-kinetic-exchange-yakovenko/stage2h/results/
          if-no-files-found: warn
