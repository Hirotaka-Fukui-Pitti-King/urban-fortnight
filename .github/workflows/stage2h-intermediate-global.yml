name: Stage 2-H 5x5 intermediate private all-pair global Nash audit

on:
  pull_request:
    paths:
      - 'research/02-kinetic-exchange-yakovenko/stage2h/scripts/audit_5x5_intermediate_global_nash.py'
      - '.github/workflows/stage2h-intermediate-global.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-pair-at-intermediate-root:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt 'cvxpy>=1.6,<1.8' 'clarabel>=0.9,<0.12'
      - name: Python syntax and dependency validation
        run: |
          python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2h/scripts/audit_5x5_intermediate_global_nash.py
          python -c 'import cvxpy; assert "CLARABEL" in cvxpy.installed_solvers()'
      - name: Reproduce lambda 0.55 private root and reoptimize all 49 Nash pair contracts
        run: python research/02-kinetic-exchange-yakovenko/stage2h/scripts/audit_5x5_intermediate_global_nash.py
      - name: Inspect reoptimized original Bellman residual without false source equilibrium claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/02-kinetic-exchange-yakovenko/stage2h/results/private_5x5_global_seed_audit.json')
          d=json.loads(p.read_text())
          assert d['stationary_GE'] is False
          assert d['source_rate_5x5_fixed_point'] is False if 'source_rate_5x5_fixed_point' in d else True
          print('Intermediate fixed-price root globally checked:',d['status'])
          print('Bellman after 49 globally reoptimized Nash pairs:',d.get('globally_reoptimized_Bellman_sup'))
          PY
      - name: Upload 5x5 economic audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2h-intermediate-all49-convex-nash
          path: research/02-kinetic-exchange-yakovenko/stage2h/results/
          if-no-files-found: warn
