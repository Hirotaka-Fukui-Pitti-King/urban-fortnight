name: Stage 2-H globally checked Nash and 5x5 private root

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convex-nash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verified numerics
        run: python -m pip install -r requirements.txt 'cvxpy>=1.6,<1.8' 'clarabel>=0.9,<0.12'
      - name: Python parse / solver dependency versions
        run: |
          python -m compileall -q research/02-kinetic-exchange-yakovenko/stage2h
          python - <<'PY'
          import cvxpy,clarabel,scipy,numpy
          print("cvxpy",cvxpy.__version__,"clarabel",clarabel.__version__,
                "scipy",scipy.__version__,"numpy",numpy.__version__)
          assert "CLARABEL" in cvxpy.installed_solvers()
          PY
      - name: Run convex economic unit tests
        run: python -m unittest discover -s research/02-kinetic-exchange-yakovenko/stage2h/tests -v
      - name: Execute convex-branch Nash pilot against analytical CM
        run: python research/02-kinetic-exchange-yakovenko/stage2h/scripts/benchmark_global_nash.py
      - name: Reoptimize all 17 relevant Nash pairs and independent 3x3 Bellman
        run: python research/02-kinetic-exchange-yakovenko/stage2h/scripts/validate_3x3_all_convex.py
      - name: Upload Nash results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2h-convex-pilot
          path: research/02-kinetic-exchange-yakovenko/stage2h/results/
          if-no-files-found: warn

  private-five:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt 'cvxpy>=1.6,<1.8' 'clarabel>=0.9,<0.12'
      - name: Execute 3x3 reproduction and 5x5 direct/continuation roots
        run: python research/02-kinetic-exchange-yakovenko/stage2h/scripts/solve_private_5x5.py --nq 9 --nx 7 --maxfev 500
      - name: Report private fixed-point status without false certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/02-kinetic-exchange-yakovenko/stage2h/results/private_5x5.json")
          d=json.loads(p.read_text())
          print("5x5 coarse convergence:",d["coarse_5x5_relative_root"])
          print("Stages:",d["stages"])
          assert d["stationary_GE"] is False
          PY
      - name: Independently globally reoptimize any saved 5x5 candidate
        run: python research/02-kinetic-exchange-yakovenko/stage2h/scripts/validate_private_5x5.py
      - name: Upload executed 5x5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2h-private-five-root
          path: research/02-kinetic-exchange-yakovenko/stage2h/results/
          if-no-files-found: warn

  related-fortran:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download public Chiu-Molico Fortran replication archive and inspect sources
        run: python research/02-kinetic-exchange-yakovenko/stage2h/scripts/audit_related_fortran.py
      - name: Upload independently retrieved source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2h-related-fortran-audit
          path: research/02-kinetic-exchange-yakovenko/stage2h/results/fortran_source_audit.json
          if-no-files-found: warn
