name: Python equilibrium tests and Quarto Typst PDFs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python scientific libraries
        run: python -m pip install -r requirements.txt
      - name: Validate nine research plans and economic stage statuses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=json.loads(Path("research-plan.json").read_text())
          assert len(root["stages"])==9
          for n,item in enumerate(root["stages"]):
              assert item["id"]==n
              folder=Path(item["directory"])
              plan=json.loads((folder/"plan.json").read_text())
              assert plan["stage"]==n
              assert plan["status"] in ("planned","numerically_validated_baseline","preliminary_particle_validation","restricted_posted_price_model_verified")
              for f in ("README.md","RESEARCH.me","results/.gitkeep"):
                  assert (folder/f).is_file(), f
          assert root["paper"]["format"]=="academic-typst"
          PY
      - name: Compile Python sources
        run: python -m compileall -q research
      - name: Test Stage 0 economics and numerics
        run: python -m unittest discover -s research/00-heterogeneous-agent-ge/tests -v
      - name: Test Stage 1 reproducibility and particle accounting
        run: python -m unittest discover -s research/01-agent-based-equilibrium/tests -v
      - name: Solve high-resolution stationary equilibrium
        run: python research/00-heterogeneous-agent-ge/scripts/run_stationary_equilibrium.py
      - name: Check GE asset-grid refinement
        run: python research/00-heterogeneous-agent-ge/scripts/run_accuracy_tests.py --quick
      - name: Produce separate SVG figures
        run: python research/00-heterogeneous-agent-ge/scripts/make_figures.py
      - name: Simulate optimal heterogeneous agents
        run: python research/01-agent-based-equilibrium/scripts/run_particles.py --quick
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Verify Pandoc and Quarto versions
        run: |
          quarto --version
          quarto pandoc --version | head -n 1
      - name: Audit original-paper retrieval evidence and provenance claims
        run: |
          python scripts/check_source_provenance.py
          python -m unittest discover -s scripts/tests -p test_source_provenance.py -v
      - name: Test the math quality gate against intentionally broken equations
        run: python -m unittest discover -s scripts/tests -p test_math_quality.py -v
      - name: Validate all QMD math with Pandoc AST and equation inventory
        run: python scripts/check_paper_math.py --source-check
      - name: Render English academic research paper
        run: quarto render paper/article.qmd --to academic-typst
      - name: Render research slides
        run: quarto render slides/research-agenda.qmd --to clean-typst
      - name: Inspect all generated PDFs and render math-heavy previews
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python scripts/check_paper_math.py --pdf-check --preview-dir math-previews
      - name: Save model data, SVG figures, and PDF papers
        uses: actions/upload-artifact@v4
        with:
          name: stage01-equilibrium-results-and-papers
          path: |
            research/00-heterogeneous-agent-ge/results/*.json
            research/00-heterogeneous-agent-ge/results/*.csv
            research/00-heterogeneous-agent-ge/results/figures/*.svg
            research/01-agent-based-equilibrium/results/*.json
            research/01-agent-based-equilibrium/results/*.csv
            paper/article.pdf
            slides/research-agenda.pdf
            math-previews/*.png
          if-no-files-found: error
          retention-days: 30
